name: Deploy su Neocities

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: neocities-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Test della logica di gioco
        run: node tests/logic.test.js

      - name: Test delle traduzioni
        run: node tests/i18n.test.js

      - name: Test del controller
        run: node tests/gamepad.test.js

      - name: Pagine per lingua e sitemap aggiornate
        run: node tools/build-pages.js --check

      - name: Test SEO
        run: node tests/seo.test.js

      - name: Upload su Neocities
        env:
          NEOCITIES_API_KEY: ${{ secrets.NEOCITIES_API_KEY }}
        run: |
          if [ -z "$NEOCITIES_API_KEY" ]; then
            echo "::error::Secret NEOCITIES_API_KEY mancante: Settings → Secrets and variables → Actions → New repository secret"
            exit 1
          fi
          ./deploy.sh
