version = 1

# Immagini: CC BY-SA 4.0
[[annotations]]
path = ["icons/**", "og-image.png"]
SPDX-FileCopyrightText = "2026 Pabs.one"
SPDX-License-Identifier = "CC-BY-SA-4.0"

