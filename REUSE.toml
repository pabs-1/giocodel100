# Tutto il resto (dati, documentazione, configurazione): AGPL-3.0-or-later
[[annotations]]
path = [
  "manifest.json",
  "robots.txt",
  "sitemap.xml",
  "README.md",
  ".gitignore",
  ".gitattributes",
  "*/index.html",
  "*/rules.html",
]
