<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="title" data-i18n-accent="title">数到 <span class="title-num">100</span></h1>
        <p class="dedica" data-i18n="dedication">献给 Spalla 的 5C 班</p>
      </div>
      <a class="btn btn-icon" href="rules.html" aria-label="游戏规则" title="规则" data-i18n-attr="aria-label:rulesLink;title:rulesTitle">?</a>
      <dl class="stats">
        <div class="stat">
          <dt data-i18n="statCurrent">数字</dt>
          <dd id="stat-current">0</dd>
        </div>
        <div class="stat">
          <dt data-i18n="statRemaining">剩余</dt>
          <dd id="stat-remaining">100</dd>
        </div>
        <div class="stat">
          <dt data-i18n="statBest">最佳</dt>
          <dd id="stat-best">0</dd>
        </div>
      </dl>
    </header>

    <main class="board-area">
      <div id="board" class="board" role="grid" aria-label="10×10 方格" data-i18n-attr="aria-label:boardLabel" aria-describedby="status"></div>
    </main>

    <p id="status" class="status" aria-live="polite" data-i18n="statusReady">点击任意格子，写下 1。</p>

    <nav class="controls" aria-label="游戏控制" data-i18n-attr="aria-label:controlsLabel">
      <button id="btn-undo" class="btn" type="button" disabled>
        <span aria-hidden="true">↶</span> <span data-i18n="undo">撤销</span>
      </button>
      <button id="btn-hints" class="btn btn-toggle" type="button" aria-pressed="true">
        <span class="switch" aria-hidden="true"></span> <span data-i18n="hints">走法</span>
      </button>
      <button id="btn-new" class="btn" type="button"><span data-i18n="newShort">新游戏</span><span class="opt" data-i18n="newRest"></span></button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
      <p class="dialog-badge" id="overlay-badge" aria-hidden="true"></p>
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div class="dialog-actions">
        <button id="overlay-undo" class="btn" type="button" data-i18n="overlayUndo">撤销上一步</button>
        <button id="overlay-new" class="btn btn-primary" type="button" data-i18n="overlayNew">新游戏</button>
        <button id="overlay-share" class="btn" type="button" data-i18n="share">分享成绩</button>
        <button id="overlay-close" class="btn btn-quiet" type="button" data-i18n="overlayClose">查看方格</button>
      </div>
      <p id="share-status" class="share-status" aria-live="polite"></p>
      <textarea id="share-text" class="share-text" readonly rows="5" aria-labelledby="share-status" hidden></textarea>
    </div>
  </div>
