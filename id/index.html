<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <h1 class="title" data-i18n-accent="title">Permainan <span class="title-num">100</span></h1>
        <p class="dedica" data-i18n="dedication">Didedikasikan untuk kelas 5C Spalla</p>
      </div>
      <a class="btn btn-icon" href="rules.html" aria-label="Aturan permainan" title="Aturan" data-i18n-attr="aria-label:rulesLink;title:rulesTitle">?</a>
      <dl class="stats">
        <div class="stat">
          <dt data-i18n="statCurrent">Angka</dt>
          <dd id="stat-current">0</dd>
        </div>
        <div class="stat">
          <dt data-i18n="statRemaining">Sisa</dt>
          <dd id="stat-remaining">100</dd>
        </div>
        <div class="stat">
          <dt data-i18n="statBest">Rekor</dt>
          <dd id="stat-best">0</dd>
        </div>
      </dl>
    </header>

    <main class="board-area">
      <div id="board" class="board" role="grid" aria-label="Kisi 10 kali 10" data-i18n-attr="aria-label:boardLabel" aria-describedby="status"></div>
    </main>

    <p id="status" class="status" aria-live="polite" data-i18n="statusReady">Ketuk kotak mana saja untuk menulis angka 1.</p>

    <nav class="controls" aria-label="Kontrol permainan" data-i18n-attr="aria-label:controlsLabel">
      <button id="btn-undo" class="btn" type="button" disabled>
        <span aria-hidden="true">↶</span> <span data-i18n="undo">Urungkan</span>
      </button>
      <button id="btn-hints" class="btn btn-toggle" type="button" aria-pressed="true">
        <span class="switch" aria-hidden="true"></span> <span data-i18n="hints">Langkah</span>
      </button>
      <button id="btn-new" class="btn" type="button"><span data-i18n="newShort">Ulang</span><span class="opt" data-i18n="newRest"></span></button>
    </nav>
  </div>

  <div id="overlay" class="overlay" hidden>
    <div class="dialog" role="dialog" aria-modal="true" aria-labelledby="overlay-title" aria-describedby="overlay-text">
      <p class="dialog-badge" id="overlay-badge" aria-hidden="true"></p>
      <h2 id="overlay-title"></h2>
      <p id="overlay-text"></p>
      <div class="dialog-actions">
        <button id="overlay-undo" class="btn" type="button" data-i18n="overlayUndo">Urungkan langkah terakhir</button>
        <button id="overlay-new" class="btn btn-primary" type="button" data-i18n="overlayNew">Permainan baru</button>
        <button id="overlay-close" class="btn btn-quiet" type="button" data-i18n="overlayClose">Lihat kisi</button>
      </div>
    </div>
  </div>
